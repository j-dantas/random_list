<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random List</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:2em auto;padding:0 1em}
li button{margin-left:.5em}
input{padding:.3em}
</style>
</head>
<body>
<label for="language" data-i18n="languageLabel">Language</label>
<select id="language">
  <option value="en">English</option>
  <option value="pt-BR">Português (Brasil)</option>
</select>

<h1 data-i18n="title">Random List</h1>
<p data-i18n="privacy">Names and results are stored only in your browser. Nothing is sent anywhere.</p>

<h2 data-i18n="namesHeading">Names</h2>
<form id="add-form">
  <input id="name" data-i18n-placeholder="namePlaceholder" placeholder="Add a name" required autocomplete="off">
  <button type="submit" data-i18n="add">Add</button>
</form>
<ul id="names"></ul>
<button id="clear" type="button" data-i18n="clear">Clear all</button>

<h2 data-i18n="orderHeading">Order</h2>
<label><input type="checkbox" id="use-seed"> <span data-i18n="useSeed">Provide a random seed</span></label>
<div id="seed-box" hidden>
  <input id="seed" data-i18n-placeholder="seedPlaceholder" placeholder="Seed (any text)">
</div>
<p><button id="shuffle" type="button" data-i18n="generate">Generate order</button></p>
<ol id="result"></ol>

<script>
(function () {
  var KEY = "random_list_names";
  var LANGUAGE_KEY = "random_list_language";
  var translations = {
    en: {
      languageLabel: "Language",
      title: "Random List",
      privacy: "Names and results are stored only in your browser. Nothing is sent anywhere.",
      namesHeading: "Names",
      namePlaceholder: "Add a name",
      add: "Add",
      remove: "Remove",
      clear: "Clear all",
      orderHeading: "Order",
      useSeed: "Provide a random seed",
      seedPlaceholder: "Seed (any text)",
      generate: "Generate order"
    },
    "pt-BR": {
      languageLabel: "Idioma",
      title: "Lista aleatória",
      privacy: "Os nomes e resultados ficam armazenados apenas no seu navegador. Nada é enviado para lugar algum.",
      namesHeading: "Nomes",
      namePlaceholder: "Adicione um nome",
      add: "Adicionar",
      remove: "Remover",
      clear: "Limpar tudo",
      orderHeading: "Ordem",
      useSeed: "Informar uma semente aleatória",
      seedPlaceholder: "Semente (qualquer texto)",
      generate: "Gerar ordem"
    }
  };
  var $ = function (id) { return document.getElementById(id); };
  var names = [];
  var language = "en";
  var savedLanguage = "en";
  try { names = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { names = []; }
  try { savedLanguage = localStorage.getItem(LANGUAGE_KEY) || "en"; } catch (e) { savedLanguage = "en"; }
  if (translations[savedLanguage]) { language = savedLanguage; }

  function translate() {
    var strings = translations[language];
    document.documentElement.lang = language;
    document.title = strings.title;
    document.querySelectorAll("[data-i18n]").forEach(function (element) {
      element.textContent = strings[element.getAttribute("data-i18n")];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (element) {
      element.placeholder = strings[element.getAttribute("data-i18n-placeholder")];
    });
    $("language").value = language;
    render();
  }

  function save() { localStorage.setItem(KEY, JSON.stringify(names)); }

  function render() {
    var ul = $("names");
    ul.textContent = "";
    names.forEach(function (n, i) {
      var li = document.createElement("li");
      li.appendChild(document.createTextNode(n));
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = translations[language].remove;
      b.onclick = function () { names.splice(i, 1); save(); render(); };
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  // cyrb128 string hash -> mulberry32 PRNG
  function hash(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(list, rand) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  $("add-form").onsubmit = function (e) {
    e.preventDefault();
    var v = $("name").value.trim();
    if (v) { names.push(v); save(); render(); }
    $("name").value = "";
  };
  $("clear").onclick = function () { names = []; save(); render(); $("result").textContent = ""; };
  $("use-seed").onchange = function () { $("seed-box").hidden = !this.checked; };
  $("language").onchange = function () {
    language = this.value;
    localStorage.setItem(LANGUAGE_KEY, language);
    translate();
  };
  $("shuffle").onclick = function () {
    var seed = $("use-seed").checked ? $("seed").value : String(Math.random()) + Date.now();
    // sort first so the same seed gives the same order regardless of input order
    var base = names.slice().sort();
    var order = shuffle(base, mulberry32(hash(seed)));
    var ol = $("result");
    ol.textContent = "";
    order.forEach(function (n) {
      var li = document.createElement("li");
      li.textContent = n;
      ol.appendChild(li);
    });
  };

  translate();
})();
</script>
</body>
</html>
